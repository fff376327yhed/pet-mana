<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>해정펫 정리</title>
<style>
:root{--bg:#f5f3ee;--panel:#fffdf8;--ink:#23201a;--mute:#6f685b;--line:#ddd6c6;--mana:#2563c9;--manabg:#e4edfb;--warn:#b4421a;--warnbg:#fbe9e1;--ok:#2f7a4a;--okbg:#e3f2e8;--t1:#8a8578;--t2:#3f8a5a;--t3:#2f6fb5;--t4:#8a4fc4;--t5:#c27a0a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171c;--panel:#1d2027;--ink:#ece8dd;--mute:#9a9484;--line:#2f3340;--mana:#7fb0ff;--manabg:#1f2a40;--warn:#f0a07c;--warnbg:#3a2620;--ok:#7fd29a;--okbg:#1f3328;--t1:#9a9484;--t2:#6cc08a;--t3:#6fb0f0;--t4:#b98af0;--t5:#f0b24a}}
:root[data-theme="dark"]{--bg:#15171c;--panel:#1d2027;--ink:#ece8dd;--mute:#9a9484;--line:#2f3340;--mana:#7fb0ff;--manabg:#1f2a40;--warn:#f0a07c;--warnbg:#3a2620;--ok:#7fd29a;--okbg:#1f3328;--t1:#9a9484;--t2:#6cc08a;--t3:#6fb0f0;--t4:#b98af0;--t5:#f0b24a}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:20px 14px 56px}
h1{font-size:28px;margin:0 0 4px;letter-spacing:-.02em}
h2{font-size:21px;margin:26px 0 8px;letter-spacing:-.01em}
h3{font-size:16px;margin:20px 0 6px}
p{margin:6px 0}
.sub{color:var(--mute);margin:0 0 14px}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:8px 0 10px;border-bottom:1px solid var(--line);margin-bottom:6px;scrollbar-width:thin}
.tab{font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;min-height:40px;cursor:pointer;white-space:nowrap}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab:hover{border-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--mana);outline-offset:2px}
.panel[hidden]{display:none}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}
.rule{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.rule b{display:block;font-size:19px;color:var(--mana)}
.rule span{font-size:12px;color:var(--mute)}
.note{border:1px solid var(--line);border-left:4px solid var(--mana);background:var(--panel);border-radius:8px;padding:9px 12px;margin:10px 0;font-size:14px}
.note.warn{border-left-color:var(--warn);background:var(--warnbg)}
.note.ok{border-left-color:var(--ok);background:var(--okbg)}
.note b.t{display:block;margin-bottom:2px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch;margin:10px 0;padding:0;list-style:none;counter-reset:s}
.flow li{counter-increment:s;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:14px}
.flow li::before{content:counter(s) ". ";color:var(--mana);font-weight:700}
.tscroll{overflow-x:auto;margin:8px 0;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mute);font-weight:600;white-space:nowrap;background:var(--bg)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.g{white-space:nowrap}
code{background:var(--manabg);color:var(--mana);padding:1px 6px;border-radius:5px;font-size:.92em}
details{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin:6px 0;padding:0 12px}
summary{cursor:pointer;padding:9px 0;font-weight:600;min-height:40px}
details[open] summary{border-bottom:1px solid var(--line);margin-bottom:8px}
details .body{padding-bottom:10px;font-size:14px}
.bars{margin:10px 0;display:grid;gap:7px}
.bar{display:grid;grid-template-columns:70px 1fr 120px;gap:8px;align-items:center;font-size:13.5px}
.bar .track{height:16px;background:var(--line);border-radius:8px;overflow:hidden}
.bar .fill{height:100%;background:var(--tc,var(--mana));min-width:2px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums}
.tools{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:5;background:var(--bg);padding:8px 0 10px;border-bottom:1px solid var(--line);margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=search],input[type=number],select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;min-height:40px}
input[type=search]{flex:1 1 200px}
input[type=number]{width:90px}
.chips{margin-top:8px}
.chip{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;min-height:34px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{color:var(--mute);font-size:13px;margin:0 0 10px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.sk{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--tc);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.sk .top{display:flex;align-items:center;gap:8px}
.sk .em{font-size:22px;line-height:1}
.sk .nm{font-weight:700;flex:1;min-width:0}
.sk .st{color:var(--tc);font-size:12px;letter-spacing:1px}
.mana{background:var(--manabg);color:var(--mana);font-weight:700;border-radius:6px;padding:2px 8px;font-size:13px;white-space:nowrap}
.meta{font-size:12px;color:var(--mute);display:flex;gap:4px 10px;flex-wrap:wrap}
.fl{font-size:13px;color:var(--mute);font-style:italic}
.fx{margin:0;padding-left:16px;font-size:13.5px}
.fx li{margin:1px 0}
.uq{font-size:11px;font-weight:700;color:var(--t4);border:1px solid var(--t4);border-radius:5px;padding:0 5px;white-space:nowrap}
.empty{color:var(--mute);padding:30px 0;text-align:center}
.loc{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin:8px 0;padding:0 12px}
.loc summary .sm{color:var(--mute);font-weight:400;font-size:13px;margin-left:6px}
.calc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.calc .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.calc label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--mute)}
.calc label.ck{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:14px;min-height:40px}
.calc .out{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}
.calc .big{background:var(--manabg);border-radius:8px;padding:8px 14px}
.calc .big b{display:block;font-size:24px;color:var(--mana);font-variant-numeric:tabular-nums}
.calc .big span{font-size:12px;color:var(--mute)}
.foot{margin-top:34px;color:var(--mute);font-size:12.5px;border-top:1px solid var(--line);padding-top:12px}
@media (max-width:520px){.bar{grid-template-columns:54px 1fr 92px}h1{font-size:24px}}
@media (prefers-reduced-motion:no-preference){.tab,.chip{transition:background .15s,color .15s,border-color .15s}}
</style>
</head>

const penaltyOf = (g) => T.CATCH_GRADE_PENALTY[g] ?? 0;
function catchCalc({ catchRate, grade, wildLv, myLv, hp, tries, bait, charm }) {
  const gap = Math.max(0, wildLv - myLv);
  const factor = Math.max(0.3, 1 - gap * 0.02);
  const weak = 1 + (1 - clamp(hp, 0, 1));
  const itemMult = 1 + clamp(bait, 0, C.CATCH_BAIT_BONUS_CAP) + (charm ? D.charmBonus : 0);
  const pen = penaltyOf(grade);
  const raw = Math.max(pen > 0 ? C.CATCH_NEG_FLOOR : C.CATCH_MIN_CHANCE, catchRate * factor * weak * itemMult - pen - C.CATCH_DROP_PER_TRY * tries);
  const cap = itemMult > 1 ? C.CATCH_MAX_WITH_ITEMS : C.CATCH_MAX_CHANCE;
  return { raw, chance: clamp(raw, 0, cap), itemMult };
}

function buildCalc() {
  const box = el('div', 'calc'); const grid = el('div', 'grid');
  const sel = el('select'); D.pets.slice().sort((a, b) => T.GRADES[a.grade].order - T.GRADES[b.grade].order || a.name.localeCompare(b.name, 'ko')).forEach((x) => { const o = el('option', '', `${x.emoji} ${x.name} (${T.GRADES[x.grade].name})`); o.value = x.id; sel.append(o); });
  sel.value = 'whale';
  const num = (v, min, max, step = 1) => { const i = el('input'); i.type = 'number'; i.min = min; i.max = max; i.step = step; i.value = v; i.inputMode = 'decimal'; return i; };
  const wildLv = num(30, 1, 200), myLv = num(30, 1, 200), hp = num(100, 0, 100), tries = num(0, 0, 20), snack = num(0, 0, 10), honey = num(0, 0, 10);
  const charm = el('input'); charm.type = 'checkbox'; const net = el('input'); net.type = 'checkbox';
  const lab = (t, c) => { const l = el('label'); l.append(el('span', '', t), c); return l; };
  const ck = (t, c) => { const l = el('label', 'ck'); l.append(c, el('span', '', t)); return l; };
  put(grid, lab('야생 펫', sel), lab('야생 펫 레벨', wildLv), lab('내 대표 펫 레벨', myLv), lab('야생 펫 남은 체력 (%)', hp), lab('이미 던진 횟수', tries), lab('🍖 간식 쓴 개수', snack), lab('🍯 황금 꿀 쓴 개수', honey), ck('🍀 행운의 부적 쓰는 중', charm), ck('🕸️ 끈끈이 그물 쓰는 중', net));
  const out = el('div', 'out'); const b1 = el('div', 'big'), b2 = el('div', 'big'), b3 = el('div', 'big');
  const v1 = el('b'), v2 = el('b'), v3 = el('b');
  b1.append(v1, el('span', '', '이번에 던졌을 때 잡힐 확률')); b2.append(v2, el('span', '', '못 잡으면 도망갈 확률')); b3.append(v3, el('span', '', '난이도'));
  out.append(b1, b2, b3); const msg = el('p', 'fl'); box.append(grid, out, msg);
  const diff = (c, raw) => raw <= 0 ? '🚫 지금은 불가능' : c >= 0.8 ? '🟢 매우 쉬움' : c >= 0.6 ? '🟩 쉬움' : c >= 0.4 ? '🟡 보통' : c >= 0.2 ? '🟠 어려움' : c >= 0.08 ? '🔴 매우 어려움' : '💀 극악';
  const upd = () => {
    const pet = PET[sel.value]; const n = (i, d) => { const x = Number(i.value); return Number.isFinite(x) ? x : d; };
    const bait = clamp(n(snack, 0), 0, 99) * D.snackBonus + clamp(n(honey, 0), 0, 99) * D.honeyBonus;
    const r = catchCalc({ catchRate: pet.catchRate, grade: pet.grade, wildLv: n(wildLv, 1), myLv: n(myLv, 1), hp: n(hp, 100) / 100, tries: clamp(n(tries, 0), 0, 99), bait, charm: charm.checked });
    v1.textContent = pct(r.chance, 1); v2.textContent = pct(fleeAfterFail(clamp(n(tries, 0), 0, 99) + 1, net.checked), 0); v3.textContent = diff(r.chance, r.raw);
    msg.textContent = r.raw <= 0 ? `계산값이 ${Math.round(r.raw * 100)}% 라서 지금 던지면 100% 빠져나가요. 체력을 더 깎거나 아이템으로 끌어올려 보세요.` : `아이템 배수 ×${r.itemMult.toFixed(2)} 적용 (간식·꿀은 합쳐서 최대 ×${(1 + C.CATCH_BAIT_BONUS_CAP).toFixed(1)}).`;
  };
  [sel, wildLv, myLv, hp, tries, snack, honey, charm, net].forEach((e) => { e.addEventListener('input', upd); e.addEventListener('change', upd); }); upd();
  return box;
}

    const line = (label, text) => { const q = el('p'); q.append(el('b', '', label + ' '), text); return q; };
    b.append(line('⚔️ 공격할 때 잘 먹혀요:', tags(r.strong)), line('⚔️ 공격할 때 별로예요:', tags(r.weak)), line('🛡️ 맞을 때 약점이에요:', tags(weakTo)), line('🛡️ 맞을 때 잘 버텨요:', tags(resists)),
      line('🐾 이 속성 펫:', pets.length ? pets.map((x) => x.emoji + x.name + (elemsOf(x.id).length > 1 ? ' ' + elemIcons(x.id) : '')).join(', ') : '—'));
    d.append(b); p.append(d);
  });

  p.append(el('h3', '', '🧮 상성 계산기'));
  const box = el('div', 'calc'), grid = el('div', 'grid'), out = el('div', 'out');
  const sel = (label, none) => { const l = el('label', '', label), s = el('select'); if (none) { const o = el('option', '', '없음'); o.value = ''; s.append(o); } Object.keys(N).forEach((k) => { const o = el('option', '', tag(k)); o.value = k; s.append(o); }); l.append(s); grid.append(l); return s; };
  const sa = sel('공격 속성'), sd1 = sel('상대 속성 1'), sd2 = sel('상대 속성 2 (있으면)', true);
  sa.value = 'fire'; sd1.value = 'grass';
  const lk = el('label', 'ck'), ck = el('input'); ck.type = 'checkbox'; lk.append(ck, '같은 속성 보너스'); grid.append(lk);
  const big = (t) => { const d = el('div', 'big'); const v = el('b'); d.append(v, el('span', '', t)); out.append(d); return v; };
  const v1 = big('상성 배율'), v2 = big('최종 배율 (보너스 포함)'), vt = big('결과');
  const calc = () => {
    const r = E.chart[sa.value]; let m = 1;
    [sd1.value, sd2.value].filter(Boolean).forEach((d) => { if (r.strong.includes(d)) m *= E.cfg.strong; else if (r.weak.includes(d)) m *= E.cfg.weak; });
    const f = m * (ck.checked && sa.value !== 'normal' ? E.cfg.stab : 1);
    v1.textContent = '×' + +m.toFixed(3); v2.textContent = '×' + +f.toFixed(3);
    vt.textContent = m >= 2 ? '🌟 약점!' : m >= 1.1 ? '✨ 굉장해요' : m <= 0.5 ? '💨 거의 없어요' : m <= 0.9 ? '💧 별로예요' : '보통';
  };
  [sa, sd1, sd2, ck].forEach((x) => x.addEventListener('change', calc)); calc();
  box.append(grid, out); p.append(box);
  return p;
}

// ───────── 조립 ─────────
const TABS = [['start', '🐣 한눈에 보기', panelStart], ['catch', '🌿 탐험·포획', panelCatch], ['battle', '⚔️ 전투·보상', panelBattle], ['world', '🗺️ 장소·펫', panelWorld], ['elem', '🌈 속성', panelElem], ['odds', '✨ 스킬 확률', panelOdds], ['skills', '📚 스킬 도감', panelSkills], ['items', '🎒 아이템·육성', panelItems]];
const panels = {};
TABS.forEach(([id, label, fn]) => { const b = el('button', 'tab', label); b.type = 'button'; b.id = 'tab-' + id; b.setAttribute('role', 'tab'); b.addEventListener('click', () => show(id)); $('tabs').append(b); const pn = fn(); pn.hidden = true; pn.setAttribute('role', 'tabpanel'); pn.setAttribute('aria-labelledby', 'tab-' + id); $('panels').append(pn); panels[id] = pn; });
function show(id, scroll = true) {
  if (!panels[id]) id = 'start';
  TABS.forEach(([k]) => { panels[k].hidden = k !== id; $('tab-' + k).setAttribute('aria-selected', String(k === id)); });
  try { history.replaceState(null, '', '#' + id); } catch (e) { /* 파일로 열어도 괜찮아요 */ }
  if (scroll) window.scrollTo({ top: 0 });
}
show((location.hash || '').slice(1) || 'start', false);
window.addEventListener('hashchange', () => show((location.hash || '').slice(1) || 'start'));
$('foot').textContent = `이 페이지의 숫자는 게임 코드의 기본값이에요. 관리자 설정으로 값을 바꿨다면 실제 게임과 다를 수 있어요. (${D.builtAt} 기준)`;
