<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>해정펫 스킬 도감</title>
<style>
:root{--bg:#f5f3ee;--panel:#fffdf8;--ink:#23201a;--mute:#6f685b;--line:#ddd6c6;--mana:#2563c9;--manabg:#e4edfb;--t1:#8a8578;--t2:#3f8a5a;--t3:#2f6fb5;--t4:#8a4fc4;--t5:#c27a0a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171c;--panel:#1d2027;--ink:#ece8dd;--mute:#9a9484;--line:#2f3340;--mana:#7fb0ff;--manabg:#1f2a40;--t1:#9a9484;--t2:#6cc08a;--t3:#6fb0f0;--t4:#b98af0;--t5:#f0b24a}}
:root[data-theme="dark"]{--bg:#15171c;--panel:#1d2027;--ink:#ece8dd;--mute:#9a9484;--line:#2f3340;--mana:#7fb0ff;--manabg:#1f2a40;--t1:#9a9484;--t2:#6cc08a;--t3:#6fb0f0;--t4:#b98af0;--t5:#f0b24a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:20px 14px 48px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 16px}
.rules{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.rule{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.rule b{display:block;font-size:18px;color:var(--mana)}
.rule span{font-size:12px;color:var(--mute)}
.slots{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:16px;font-size:13px;color:var(--mute)}
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0 10px;border-bottom:1px solid var(--line);margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=search],select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input[type=search]{flex:1 1 200px}
.chips{margin-top:8px}
.chip{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 11px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{color:var(--mute);font-size:13px;margin:0 0 10px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.sk{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--tc);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.sk .top{display:flex;align-items:center;gap:8px}
.sk .em{font-size:22px;line-height:1}
.sk .nm{font-weight:700;flex:1;min-width:0}
.sk .st{color:var(--tc);font-size:12px;letter-spacing:1px}
.mana{background:var(--manabg);color:var(--mana);font-weight:700;border-radius:6px;padding:2px 8px;font-size:13px;white-space:nowrap}
.meta{font-size:12px;color:var(--mute);display:flex;gap:10px;flex-wrap:wrap}
.fl{font-size:13px;color:var(--mute);font-style:italic}
.fx{margin:0;padding-left:16px;font-size:13.5px}
.fx li{margin:1px 0}
.empty{color:var(--mute);padding:30px 0;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>🐾 해정펫 스킬 도감</h1>
  <p class="sub">스킬 <span id="total"></span>개 · 마나 소모량과 효과를 한눈에 봐요</p>
  <div class="rules" id="rules"></div>
  <div class="slots" id="slots"></div>
  <div class="tools">
    <div class="row">
      <input type="search" id="q" placeholder="스킬 이름 · 효과 · 펫 이름으로 검색 (예: 기절, 흡혈, 슬라임)">
      <select id="sort">
        <option value="mana-asc">마나 적은 순</option>
        <option value="mana-desc">마나 많은 순</option>
        <option value="tier-desc">등급 높은 순</option>
        <option value="name">이름 순</option>
      </select>
    </div>
    <div class="row chips" id="cats"></div>
    <div class="row chips" id="tiers"></div>
  </div>
  <p class="count" id="count"></p>
  <div class="list" id="list"></div>
</div>

const CFG = DATA.cfg, S = DATA.skills;
const TC = {1:'var(--t1)',2:'var(--t2)',3:'var(--t3)',4:'var(--t4)',5:'var(--t5)'};
const state = {q:'',cat:'전체',tier:0,sort:'mana-asc'};
const $ = id => document.getElementById(id);
const firstTurn = c => Math.max(1, Math.ceil((c - CFG.manaStart) / CFG.manaPerTurn) + 1);

$('total').textContent = S.length;
[[CFG.manaMax,'최대 마나'],[CFG.manaStart,'전투 시작 마나'],['+'+CFG.manaPerTurn,'매 턴 회복'],['+'+CFG.crystalMana,'마나 수정 1개 (최대 +'+CFG.crystalMaxBonus+')']].forEach(([v,l])=>{
  const d=document.createElement('div');d.className='rule';
  const b=document.createElement('b');b.textContent=v;const s=document.createElement('span');s.textContent=l;
  d.append(b,s);$('rules').append(d);
});
$('slots').textContent = `슬롯 5칸: 1번 Lv.${CFG.slot1Level} · 2번 Lv.${CFG.slot2Level} · 3번 Lv.${CFG.slot3Level} · 4번 Lv.${CFG.slot4Level} · 5번 상점 슬롯 개방권. 열릴 때 랜덤 스킬이 들어오고, 전용기는 ${Math.round(CFG.sigChance*100)}% 확률로 나와요.`;

function chips(el, items, key){
  items.forEach(([val,label])=>{
    const b=document.createElement('button');b.className='chip';b.textContent=label;b.dataset.v=val;
    b.setAttribute('aria-pressed', String(state[key]===val));
    b.onclick=()=>{state[key]=val;[...el.children].forEach(c=>c.setAttribute('aria-pressed',String(String(c.dataset.v)===String(val))));render();};
    el.append(b);
  });
}
const cats=['전체','공격','강화','약화','회복·방어','전용기'];
chips($('cats'), cats.map(c=>[c, c==='전체'?'전체':`${c} ${S.filter(s=>s.k===c).length}`]), 'cat');
chips($('tiers'), [[0,'모든 등급'],...[1,2,3,4,5].map(t=>[t,'★'.repeat(t)])], 'tier');
$('q').oninput=e=>{state.q=e.target.value.trim().toLowerCase();render();};
$('sort').onchange=e=>{state.sort=e.target.value;render();};

function card(s){
  const d=document.createElement('div');d.className='sk';d.style.setProperty('--tc',TC[s.t]);
  const top=document.createElement('div');top.className='top';
  const em=document.createElement('span');em.className='em';em.textContent=s.e;
  const nm=document.createElement('span');nm.className='nm';nm.textContent=s.n;
  const st=document.createElement('span');st.className='st';st.textContent='★'.repeat(s.t);
  const mn=document.createElement('span');mn.className='mana';mn.textContent='마나 '+s.c;
  top.append(em,nm,st,mn);
  const meta=document.createElement('div');meta.className='meta';
  const m1=document.createElement('span');m1.textContent=s.p?`${s.pe} ${s.p} 전용기`:s.k;
  const m2=document.createElement('span');m2.textContent=`${firstTurn(s.c)}턴째부터 사용`;
  meta.append(m1,m2);d.append(top,meta);
  if(s.f){const f=document.createElement('div');f.className='fl';f.textContent=s.f;d.append(f);}
  const ul=document.createElement('ul');ul.className='fx';
  s.x.forEach(l=>{const li=document.createElement('li');li.textContent=l;ul.append(li);});
  d.append(ul);return d;
}
function render(){
  let r=S.filter(s=>(state.cat==='전체'||s.k===state.cat)&&(!state.tier||s.t===state.tier)&&
    (!state.q||(s.n+' '+(s.p??'')+' '+s.x.join(' ')+' '+(s.f??'')).toLowerCase().includes(state.q)));
  const by={ 'mana-asc':(a,b)=>a.c-b.c||b.t-a.t||a.n.localeCompare(b.n,'ko'),'mana-desc':(a,b)=>b.c-a.c||b.t-a.t||a.n.localeCompare(b.n,'ko'),
    'tier-desc':(a,b)=>b.t-a.t||a.c-b.c||a.n.localeCompare(b.n,'ko'),'name':(a,b)=>a.n.localeCompare(b.n,'ko')}[state.sort];
  r.sort(by);
  $('count').textContent=`${r.length}개 표시 중`;
  const list=$('list');list.replaceChildren();
  if(!r.length){const e=document.createElement('div');e.className='empty';e.textContent='조건에 맞는 스킬이 없어요 🥲';list.append(e);return;}
  const frag=document.createDocumentFragment();r.forEach(s=>frag.append(card(s)));list.append(frag);
}
render();
</script>
